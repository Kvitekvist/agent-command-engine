name: Tests

# Runs the Agent Command Engine test suite on every push and pull request
# targeting main. Run the dependency-free checks first, then install the lockfile
# for migration, renderer and real runtime checks.
#
# The suite runs on all three developer platforms (macOS, Windows, Linux), not
# just Linux: past macOS-only regressions in platform-divergent code (tokscale
# spawn paths, arg parsing, JSON preamble handling -- TICKET-0059/0061/0098)
# passed a Linux-only CI and only surfaced on a teammate's Mac after merge. A
# matrix here catches that class before merge, since the team develops on both
# macOS and Windows (TICKET-0099).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      # Don't cancel the other OSes when one fails -- a platform-specific
      # failure is exactly what this matrix exists to surface, so we want to
      # see which platforms are affected.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        # bash is available on all three runners (Git Bash on windows-latest),
        # so the one POSIX script drives the suite uniformly across the matrix.
        shell: bash
        run: bash scripts/run_tests.sh

      - name: Install locked dependencies
        working-directory: src
        run: npm ci

      - name: Test installed dependencies and migrations
        working-directory: src
        run: npm test

      - name: Build renderer and main
        working-directory: src
        run: npm run build

      - name: Start a real PTY
        working-directory: src
        run: node scripts/smoke-pty.js

      - name: Exercise built renderer and offline workers
        if: runner.os != 'Linux'
        working-directory: src
        run: node node_modules/electron/cli.js scripts/smoke-renderer.js

      - name: Exercise built renderer under Xvfb
        if: runner.os == 'Linux'
        working-directory: src
        run: xvfb-run -a node node_modules/electron/cli.js --no-sandbox scripts/smoke-renderer.js

      - name: Exercise real main authorization and session recovery
        if: runner.os != 'Linux'
        working-directory: src
        run: node node_modules/electron/cli.js scripts/smoke-main.js

      - name: Exercise real main under Xvfb
        if: runner.os == 'Linux'
        working-directory: src
        run: xvfb-run -a node node_modules/electron/cli.js --no-sandbox scripts/smoke-main.js
