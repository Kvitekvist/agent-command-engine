name: Release

# Builds installers on a version tag push (e.g. `git tag v0.1.20 && git push
# origin v0.1.20`) and attaches them to a GitHub Release for that tag,
# creating the release if it doesn't already exist. Runs on real macOS/Windows
# runners because electron-builder's dmg target needs to run on macOS.
#
# Builds are unsigned (no Apple Developer / code-signing certs configured) --
# macOS Gatekeeper will show an "unidentified developer" warning on first
# launch; right-click > Open bypasses it. scripts/install-mac.sh strips the
# quarantine flag for the same reason.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run package

      # Prove the packaged app can actually spawn tokscale's native binary from
      # app.asar.unpacked before we ship it. This is the only layer that catches
      # the TICKET-0029/0100 class of bug (asar spawn), which is invisible to the
      # unit matrix and `npm run dev`. A broken package fails the release here.
      - name: Smoke-test packaged build
        shell: bash
        run: node scripts/smoke-package.js

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          cd ../releases
          shopt -s nullglob
          files=(*.dmg *.exe)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
