name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    env:
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require release signing credentials
        shell: bash
        run: |
          test -n "$CSC_LINK" || { echo "Signing certificate is required"; exit 1; }
          if [ "$RUNNER_OS" = macOS ]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || exit 1
          fi
      - name: Check tag and version
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF#refs/tags/}"
          node -e "const fs=require('fs');if(fs.readFileSync('../version.txt','utf8').trim()!==require('./package.json').version)process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: node scripts/smoke-pty.js
      - name: Install both macOS tokscale binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          V=$(node -p "require('./node_modules/@tokscale/cli/package.json').version")
          npm install --no-save --force "@tokscale/cli-darwin-x64@$V" "@tokscale/cli-darwin-arm64@$V"
          chmod +x node_modules/@tokscale/cli-darwin-*/bin/tokscale
      - run: npm run build
      - run: node node_modules/electron/cli.js scripts/smoke-renderer.js
      - run: node node_modules/electron/cli.js scripts/smoke-main.js
      - run: npm run fetch:mingit
      - run: npx electron-builder --config.forceCodeSigning=true
      - name: Smoke-test packaged build
        run: node scripts/smoke-package.js
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem ../releases -Filter *.exe
          if (!$artifacts) { throw 'No Windows artifacts' }
          foreach ($artifact in $artifacts) {
            if ((Get-AuthenticodeSignature -LiteralPath $artifact.FullName).Status -ne 'Valid') {
              throw "Invalid signature: $($artifact.Name)"
            }
          }
      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -n "$(find ../releases -maxdepth 3 -name '*.app' -print -quit)" || exit 1
          find ../releases -maxdepth 3 -name '*.app' -print0 | while IFS= read -r -d '' app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          done
      - name: Create checksums
        shell: bash
        run: node ../scripts/release-checksums.js "$RUNNER_OS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            releases/*.exe
            releases/*.dmg
            releases/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY"
