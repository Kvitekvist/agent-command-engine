name: Tests

# Runs the project's test suite on every push and pull request targeting main.
# scripts/run_tests.sh is the single entry point - point it at the real test
# command for this project's stack and CI follows automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: bash scripts/run_tests.sh

